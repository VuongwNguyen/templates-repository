# Test Configuration for Docker
version: '3.8'

services:
  app-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - NODE_ENV=test
      - JWT_SECRET=test-secret-key
      - JWT_REFRESH_SECRET=test-refresh-secret
      - CORS_ORIGIN=http://localhost:3000
      - RATE_LIMIT_WINDOW=900000
      - RATE_LIMIT_MAX=100
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: npm test
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - test-network

  mongodb-test:
    image: mongo:6
    environment:
      - MONGO_INITDB_DATABASE=test_db
    ports:
      - "27018:27017"
    networks:
      - test-network

networks:
  test-network:
    driver: bridge